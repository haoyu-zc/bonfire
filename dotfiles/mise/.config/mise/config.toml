# =============================================================================
# mise global configuration
# https://mise.jdx.dev/
# Manages dev tool versions across all projects.
#
# Pinning strategy:
# - Shell-facing tools (starship, fzf, zoxide, eza, bat) are pinned to majors
#   so that a year-from-now bootstrap doesn't pull a breaking 2.0 and silently
#   change shell behavior.
# - Fast-moving / mature tools (ruff, uv, jq, yq, lazygit, delta, ripgrep,
#   fd, zellij, git-lfs) stay on "latest" — low regression risk + you want fixes.
# - gh (GitHub CLI) is also installed system-wide via apt in --admin runs
#   (config/packages.toml); it's listed here too so per-user runs on a box
#   without it still get one. 07-mise.sh reads `gh auth token` to lift mise's
#   GitHub API rate limit; with no token the bootstrap stops with instructions.
# - When adding a new ubi: entry with a major pin, smoke-test `mise install`
#   once to confirm the project's release tag format parses cleanly.
# =============================================================================

[tools]
# Language runtimes
node = "lts"
python = "3.12"

# Editors
neovim = "stable"

# CLI tools via ubi backend (pulls prebuilt binaries from GitHub releases)
"ubi:junegunn/fzf"             = "0"        # fuzzy finder
"ubi:ajeetdsouza/zoxide"       = "0"        # smarter cd
"ubi:BurntSushi/ripgrep[exe=rg]" = "latest" # fast grep (binary named rg inside archive)
"ubi:sharkdp/bat"              = "0"        # cat with syntax highlighting
"ubi:sharkdp/fd"               = "latest"   # fast find
"ubi:eza-community/eza"        = "0"        # modern ls
"ubi:dandavison/delta"         = "latest"   # better git diff
"ubi:jesseduffield/lazygit"    = "latest"   # terminal git UI
"ubi:starship/starship"        = "1"        # cross-shell prompt
# tealdeer: installed via apt/brew (recent GitHub releases don't ship Linux binaries)
"ubi:jqlang/jq"                = "latest"   # JSON processor
"ubi:mikefarah/yq"             = "latest"   # YAML processor
"ubi:astral-sh/uv"             = "latest"   # fast Python package manager
"ubi:astral-sh/ruff"           = "latest"   # fast Python linter + formatter
git-lfs = "latest"
gh = "latest"                                 # GitHub CLI (see note above)
zellij = "latest"

# Modern coreutils replacements
"ubi:dalance/procs"            = "0"        # ps replacement
"ubi:bootandy/dust"            = "1"        # du replacement
"ubi:muesli/duf"               = "0"        # df replacement
"ubi:aristocratos/btop"        = "1"        # top replacement
"ubi:chmln/sd"                 = "1"        # sed for simple substitutions
"ubi:sharkdp/hyperfine"        = "1"        # CLI benchmarking

# File manager and TUI helpers
"ubi:sxyazi/yazi"              = "0"        # file manager (paired with y() in .zshrc)
"ubi:charmbracelet/gum"        = "0"        # TUI prompts/spinners for shell scripts

[settings]
# Always use the latest compatible version for each tool
experimental = true
