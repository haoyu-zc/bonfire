name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  bootstrap-smoke:
    name: User path (mise + dotfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install base dependencies
        # 09-dotfiles.sh auto-installs stow if missing; we still pre-install
        # the most common build deps so 07-mise has what it needs for ubi extracts.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends stow ca-certificates curl

      - name: Run bootstrap (mise + dotfiles only)
        # `--only` matches by keyword. 12-verify is intentionally NOT run here:
        # it checks desktop/SSH/Docker state that doesn't exist on the runner.
        # GITHUB_TOKEN raises the GitHub API rate limit from 60/hr to 5000/hr,
        # which mise needs because every ubi:/aqua: tool resolves a tag via the
        # /releases API. Scoped to this step only (the verification grep steps
        # below don't need it).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bootstrap.sh --yes --only "07-mise 09-dotfiles"

      - name: Verify mise-managed tools are on PATH
        run: |
          export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
          missing=()
          for cmd in fzf zoxide rg bat fd eza delta lazygit starship jq yq uv ruff node python3 \
                    procs dust duf btop sd hyperfine gum yazi; do
              if ! command -v "$cmd" >/dev/null 2>&1; then
                  missing+=("$cmd")
              fi
          done
          if (( ${#missing[@]} > 0 )); then
              printf 'MISSING: %s\n' "${missing[@]}"
              exit 1
          fi
          echo "All expected mise-managed tools resolved."

      - name: Verify dotfile drift is clean
        # bin/dotcheck exits 1 on any drift after a successful stow.
        run: bin/dotcheck

  idempotency:
    name: Idempotency (second bootstrap is no-op)
    # Skip if smoke already failed — saves runner minutes since this job
    # does the same work and then more.
    needs: bootstrap-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends stow ca-certificates curl

      - name: First bootstrap run (mutates as needed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # pipefail so a bootstrap failure isn't masked by tee's success.
        shell: bash -o pipefail {0}
        run: bash bootstrap.sh --yes --only "07-mise 09-dotfiles" 2>&1 | tee run1.log

      - name: Second bootstrap run (should be no-op)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -o pipefail {0}
        run: bash bootstrap.sh --yes --only "07-mise 09-dotfiles" 2>&1 | tee run2.log

      - name: Assert filesystem state is clean after run-2
        # stow's exit code can be 0 even when conflicts are logged, so the
        # [mutate]-line check below is not sufficient on its own — pair it
        # with a state-based assertion via dotcheck.
        run: bin/dotcheck

      - name: Assert no new mutations on second run
        # The `[mutate]` marker is printed by scripts/_lib.sh:run() before any
        # mutating command. Some wrapped commands (mise install, mise reshim,
        # stow --restow) are externally idempotent: they print the marker on
        # every run but actually do nothing the second time. We filter those
        # out, then assert the remainder is empty.
        run: |
          new_mutations=$(grep '^\[mutate\]' run2.log \
              | grep -v 'mise install' \
              | grep -v 'mise reshim' \
              | grep -v 'stow -t' \
              || true)
          if [[ -n "$new_mutations" ]]; then
              echo "FAIL: second bootstrap introduced new mutations:"
              echo "$new_mutations"
              exit 1
          fi
          echo "Idempotency check passed (no new mutations on run-2)."

  run-modes:
    name: Run-mode selection (admin vs user)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: --admin selects all 12 steps
        # Feed 'n' to the confirm prompt so it prints the plan then aborts
        # cleanly — asserts selection only, runs no step.
        run: |
          out=$(printf 'n\n' | bash bootstrap.sh --admin --dry-run 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Mode:.*ADMIN' || { echo "FAIL: no ADMIN banner"; exit 1; }
          for s in 01-system-update 02-homebrew 03-apt-repos 04-apt-packages 05-flatpak \
                   06-appimages 07-mise 08-shell-setup 09-dotfiles 10-ssh-server \
                   11-desktop-settings 12-verify; do
              printf '%s\n' "$out" | grep -qE "^  ${s}\.sh" || { echo "FAIL: --admin missing ${s}"; exit 1; }
          done
          echo "OK: --admin lists all 12 steps"

      - name: default (user) run skips admin-only steps
        run: |
          out=$(printf 'n\n' | bash bootstrap.sh --dry-run 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Mode:.*USER' || { echo "FAIL: no USER banner"; exit 1; }
          for s in 01-system-update 02-homebrew 03-apt-repos 04-apt-packages 05-flatpak 11-desktop-settings; do
              printf '%s\n' "$out" | grep -q "Skipping ${s}.sh (admin-only" || { echo "FAIL: should skip ${s}"; exit 1; }
          done
          for s in 06-appimages 07-mise 08-shell-setup 09-dotfiles 10-ssh-server 12-verify; do
              printf '%s\n' "$out" | grep -qE "^  ${s}\.sh" || { echo "FAIL: should run ${s}"; exit 1; }
          done
          echo "OK: default run skips the 6 admin steps, keeps the 6 user steps"

  admin-provision:
    name: Admin path (apt repos + gh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run admin step 03-apt-repos (--admin)
        # Proves an admin-tagged step actually executes under --admin, and
        # exercises 03's binary-keyring path (GitHub CLI ships a binary keyring,
        # Google/Microsoft ship ASCII-armored keys — both branches run here).
        run: bash bootstrap.sh --admin --yes --only 03-apt-repos

      - name: Assert GitHub CLI repo + keyring were installed
        run: |
          test -f /etc/apt/keyrings/github-cli.gpg
          test -f /etc/apt/sources.list.d/github-cli.list
          echo "OK: github-cli repo + keyring present"

      - name: Install gh from the new repo (proves the repo/key work)
        run: |
          sudo apt-get install -y gh
          gh --version
